<script>
  function updateDate() {
    var now = new Date();

        <span id="clock" role="timer" aria-live="polite"></span>


<script>
  document.addEventListener('DOMContentLoaded', function() {
    const clockElement = document.getElementById('clock');
    let timerInterval;

    // 格式化时间函数
    function formatTime(unit) {
      return unit < 10 ? '0' + unit : unit;
    }

    // 更新时钟 - 包含秒
    function updateClock() {
      const now = new Date();
      const hours = formatTime(now.getHours());
      const minutes = formatTime(now.getMinutes());
      const seconds = formatTime(now.getSeconds());
      clockElement.textContent = `${hours}:${minutes}:${seconds}`;
    }

    // 初始化时钟
    function startClock() {
      // 立即更新一次时间
      updateClock();
      // 每秒更新一次
      timerInterval = setInterval(updateClock, 1000);
    }

    // 页面可见性变化时的优化
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        // 页面不可见时停止更新
        clearInterval(timerInterval);
      } else {
        // 页面重新可见时，重新开始
        clearInterval(timerInterval);
        startClock();
      }
    });

    // 启动时钟
    startClock();
  });
</script>

        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyHbeStyles);
    } else {
        applyHbeStyles();
    }

    var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.addedNodes.length > 0) {
                for (var i = 0; i < mutation.addedNodes.length; i++) {
                    var node = mutation.addedNodes[i];
                    if (node.classList && (node.classList.contains('hbe-container') || 
                        node.querySelector && node.querySelector('.hbe-container'))) {
                        applyHbeStyles();
                        return;
                    }
                }
            }
        });
    });

    observer.observe(document.body, { childList: true, subtree: true });
})();

<script>
(function() {
    var container = document.getElementById('post-container');
    if (container) {
        var postDateStr = container.getAttribute('data-post-date');
        if (postDateStr) {
            var postDate = new Date(postDateStr);
            var now = new Date();
            
            if (postDate > now) {
                var diffMs = postDate - now;
                var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                var diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                
                var timeStr = '';
                if (diffDays > 0) timeStr += diffDays + '天';
                if (diffHours > 0) timeStr += diffHours + '小时';
                if (diffMinutes > 0) timeStr += diffMinutes + '分钟';
                
                container.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: #e1e1ff;"><h2 style="font-size: 1.5rem; margin-bottom: 20px;">⏰ 文章尚未发布</h2><p style="font-size: 1rem; margin-bottom: 10px;">这篇文章计划于 <strong>' + postDate.toLocaleString('zh-CN') + '</strong> 发布</p><p style="font-size: 0.9rem; color: #888;">还需等待约 ' + timeStr + '</p></div>';
                return;
            }
        }
    }
})();

      <script>
        document.addEventListener('DOMContentLoaded', function() {
          if (window.mermaid) {
            mermaid.initialize({
              startOnLoad: false,
              theme: 'dark',
              flowchart: {
                useMaxWidth: true,
                htmlLabels: true,
                curve: 'basis',
                nodeSpacing: 50,
                rankSpacing: 100
              },
              themeVariables: {
                primaryColor: '#6366f1',
                primaryTextColor: '#ffffff',
                primaryBorderColor: '#818cf8',
                lineColor: '#818cf8',
                secondaryColor: '#4f46e5',
                tertiaryColor: '#3730a3',
                backgroundColor: '#1e1e2e',
                mainBkg: '#312e81',
                edgeColor: '#818cf8',
                textColor: '#ffffff',
                fontSize: '14px'
              }
            });

            var mermaidPres = document.querySelectorAll('pre.mermaid');
            mermaidPres.forEach(function(pre) {
              var div = document.createElement('div');
              div.className = 'mermaid';
              div.textContent = pre.textContent || pre.innerText;
              pre.parentNode.replaceChild(div, pre);
            });

            var codeBlocks = document.querySelectorAll('pre code');
            codeBlocks.forEach(function(code) {
              var text = code.textContent || code.innerText;
              if (text.trim().startsWith('flowchart') || 
                  text.trim().startsWith('graph') || 
                  text.trim().startsWith('sequenceDiagram') ||
                  text.trim().startsWith('classDiagram') ||
                  text.trim().startsWith('stateDiagram') ||
                  text.trim().startsWith('pie') ||
                  text.trim().startsWith('gantt')) {
                
                var pre = code.parentElement;
                var figure = pre.parentElement;
                
                var mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = text;
                
                if (figure && figure.tagName === 'FIGURE') {
                  figure.parentNode.replaceChild(mermaidDiv, figure);
                } else if (pre) {
                  pre.parentNode.replaceChild(mermaidDiv, pre);
                }
              }
            });

            function setupMermaidZoom() {
              console.log('Setting up mermaid zoom feature...');
              var mermaidDivs = document.querySelectorAll('.mermaid');
              console.log('Found ' + mermaidDivs.length + ' mermaid divs');
              
              if (mermaidDivs.length === 0) {
                return;
              }
              
              var modal = document.getElementById('mermaid-modal');
              if (!modal) {
                modal = document.createElement('div');
                modal.id = 'mermaid-modal';
                modal.className = 'mermaid-modal-overlay';
                modal.innerHTML = '<div class="mermaid-modal-content"><div class="mermaid-zoom-controls"><button class="mermaid-zoom-btn-sm" data-zoom="out">-</button><button class="mermaid-zoom-btn-sm" data-zoom="reset">1:1</button><button class="mermaid-zoom-btn-sm" data-zoom="in">+</button></div><div class="mermaid-zoom-info">缩放: 100%</div><button class="mermaid-modal-close">&times;</button><div class="mermaid-svg-container"></div></div>';
                document.body.appendChild(modal);
                
                modal.zoomState = { scale: 1, translateX: 0, translateY: 0 };
                
                var closeBtn = modal.querySelector('.mermaid-modal-close');
                closeBtn.addEventListener('click', function() {
                  modal.classList.remove('active');
                  document.body.style.overflow = '';
                });
                
                modal.addEventListener('click', function(e) {
                  if (e.target === modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                  }
                });
                
                document.addEventListener('keydown', function(e) {
                  if (e.key === 'Escape' && modal.classList.contains('active')) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                  }
                });
                
                var zoomInBtn = modal.querySelector('[data-zoom="in"]');
                var zoomOutBtn = modal.querySelector('[data-zoom="out"]');
                var zoomResetBtn = modal.querySelector('[data-zoom="reset"]');
                
                zoomInBtn.addEventListener('click', function() {
                  zoomSvg(1.2);
                });
                
                zoomOutBtn.addEventListener('click', function() {
                  zoomSvg(0.8);
                });
                
                zoomResetBtn.addEventListener('click', function() {
                  resetZoom();
                });
                
                var svgContainer = modal.querySelector('.mermaid-svg-container');
                
                svgContainer.addEventListener('mousedown', function(e) {
                  if (e.target.tagName === 'svg') {
                    modal.zoomState.isDragging = true;
                    modal.zoomState.startX = e.clientX - modal.zoomState.translateX;
                    modal.zoomState.startY = e.clientY - modal.zoomState.translateY;
                    e.preventDefault();
                  }
                });
                
                document.addEventListener('mousemove', function(e) {
                  if (modal.zoomState.isDragging) {
                    modal.zoomState.translateX = e.clientX - modal.zoomState.startX;
                    modal.zoomState.translateY = e.clientY - modal.zoomState.startY;
                    updateTransform();
                  }
                });
                
                document.addEventListener('mouseup', function() {
                  modal.zoomState.isDragging = false;
                });
                
                svgContainer.addEventListener('wheel', function(e) {
                  e.preventDefault();
                  var delta = e.deltaY > 0 ? 0.9 : 1.1;
                  zoomSvg(delta);
                }, { passive: false });
                
                function zoomSvg(factor) {
                  modal.zoomState.scale = Math.max(0.5, Math.min(5, modal.zoomState.scale * factor));
                  updateTransform();
                  updateZoomInfo();
                }
                
                function resetZoom() {
                  modal.zoomState.scale = 1;
                  modal.zoomState.translateX = 0;
                  modal.zoomState.translateY = 0;
                  updateTransform();
                  updateZoomInfo();
                }
                
                function updateTransform() {
                  var svg = svgContainer.querySelector('svg');
                  if (svg) {
                    svg.style.transform = 'translate(' + modal.zoomState.translateX + 'px, ' + modal.zoomState.translateY + 'px) scale(' + modal.zoomState.scale + ')';
                    svg.style.transformOrigin = 'center center';
                  }
                }
                
                function updateZoomInfo() {
                  var info = modal.querySelector('.mermaid-zoom-info');
                  if (info) {
                    info.textContent = '缩放: ' + Math.round(modal.zoomState.scale * 100) + '%';
                  }
                }
                
                modal.updateTransform = updateTransform;
                modal.updateZoomInfo = updateZoomInfo;
              }
              
              mermaidDivs.forEach(function(div) {
                if (div.parentNode.classList.contains('mermaid-wrapper')) {
                  return;
                }
                
                var wrapper = document.createElement('div');
                wrapper.className = 'mermaid-wrapper';
                
                var zoomBtn = document.createElement('button');
                zoomBtn.className = 'mermaid-zoom-btn';
                zoomBtn.innerHTML = '&#x1F50D;';
                zoomBtn.title = '点击放大';
                
                div.parentNode.insertBefore(wrapper, div);
                wrapper.appendChild(div);
                wrapper.appendChild(zoomBtn);
                
                zoomBtn.addEventListener('click', function() {
                  console.log('Zoom button clicked');
                  var content = modal.querySelector('.mermaid-modal-content');
                  var svgContainer = modal.querySelector('.mermaid-svg-container');
                  var svg = div.querySelector('svg');
                  console.log('Found SVG:', !!svg);
                  
                  if (svg) {
                    var clonedSvg = svg.cloneNode(true);
                    clonedSvg.style.maxWidth = 'none';
                    clonedSvg.style.maxHeight = 'none';
                    clonedSvg.style.width = 'auto';
                    clonedSvg.style.height = 'auto';
                    clonedSvg.style.display = 'block';
                    clonedSvg.style.transformOrigin = 'center center';
                    var existingSvg = svgContainer.querySelector('svg');
                    if (existingSvg) {
                      existingSvg.remove();
                    }
                    svgContainer.appendChild(clonedSvg);
                  }
                  
                  modal.classList.add('active');
                  document.body.style.overflow = 'hidden';
                  
                  setTimeout(function() {
                    var svgEl = svgContainer.querySelector('svg');
                    if (svgEl) {
                      var svgRect = svgEl.getBoundingClientRect();
                      var contentRect = content.getBoundingClientRect();
                      console.log('SVG rect:', svgRect.width, svgRect.height);
                      console.log('Content rect:', contentRect.width, contentRect.height);
                      
                      if (svgRect.width > 0 && svgRect.height > 0) {
                        var scaleX = (contentRect.width * 0.9) / svgRect.width;
                        var scaleY = (contentRect.height * 0.9) / svgRect.height;
                        var scale = Math.min(scaleX, scaleY);
                        console.log('Calculated scale:', scale);
                        
                        modal.zoomState.scale = scale;
                        modal.zoomState.translateX = (contentRect.width - svgRect.width * scale) / 2;
                        modal.zoomState.translateY = (contentRect.height - svgRect.height * scale) / 2;
                        modal.updateTransform();
                        modal.updateZoomInfo();
                      }
                    }
                  }, 100);
                });
              });
            }
            
            try {
              console.log('Calling mermaid.run()...');
              var runResult = mermaid.run();
              console.log('mermaid.run() returned:', runResult);
              
              if (runResult && typeof runResult.then === 'function') {
                runResult.then(function() {
                  console.log('mermaid.run() promise resolved');
                  setupMermaidZoom();
                }).catch(function(err) {
                  console.error('Mermaid run error:', err);
                  setTimeout(setupMermaidZoom, 500);
                });
              } else {
                console.log('mermaid.run() is not a promise, calling setupMermaidZoom directly');
                setTimeout(setupMermaidZoom, 300);
              }
            } catch (e) {
              console.error('Error running mermaid:', e);
              setTimeout(setupMermaidZoom, 1000);
            }
            
            setTimeout(setupMermaidZoom, 2000);
          }
        });
      </script>
